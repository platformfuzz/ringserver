name: Bump ringserver

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: bump-ringserver
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump RINGSERVER_VERSION from EarthScope releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^ARG RINGSERVER_VERSION=//p' Dockerfile | head -n1)"
          latest="$(gh api repos/EarthScope/ringserver/releases/latest --jq .tag_name)"
          latest="${latest#v}"
          echo "current=${current} latest=${latest}"
          if [ "${current}" = "${latest}" ]; then
            echo "Already on ${latest}"
            exit 0
          fi
          sed -i "s/^ARG RINGSERVER_VERSION=.*/ARG RINGSERVER_VERSION=${latest}/" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore(deps): bump ringserver to ${latest}"
          git tag "v${latest}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "v${latest}"
