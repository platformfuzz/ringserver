name: Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ringserver:smoke .

      - name: Container starts without port bind error
        run: |
          set -euo pipefail
          log="$(timeout 5 docker run --rm --name ringserver-smoke ringserver:smoke 2>&1 || true)"
          echo "$log"
          echo "$log" | grep -q 'Ring initialized'
          ! echo "$log" | grep -q 'Address already in use'
